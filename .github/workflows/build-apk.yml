name: Build Bomb APK

on:
  push:
    branches: [ "main", "hzz" ]
  pull_request:
    branches: [ "main", "hzz" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --continue

      - name: Build Preview Debug APK
        run: ./gradlew :app-preview:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bomb-Preview-Debug-APK
          path: app-preview/build/outputs/apk/debug/*.apk
          retention-days: 7
